name: report-generator — PDF structural diagnosis (manual)

# SETTLED 2026-08-09, and kept as the regression tool for the same question.
#
# This existed to test a diagnosis that turned out to be backwards: the whole
# report-generator suite had been skipped in CI on the conclusion that the
# artifact was corrupt on Linux. Every check behind that ran through pdf-parse,
# which cannot distinguish a broken PARSER from a broken ARTIFACT — both come
# back red identically.
#
# Two checks that avoid it settled it in one run: a structural sweep that
# touches no parser (57/57 valid on Linux, same sizes as Windows), and a
# cross-parse of a committed Windows-generated PDF that Windows pdf-parse
# accepts — Linux pdf-parse threw `bad XRef entry` on identical bytes, which
# cannot happen to a genuinely corrupt file. pdf-parse (pdf.js v1.10.100, 2018)
# was the defect; it is gone, replaced by unpdf, and the suite is un-skipped and
# green on Linux.
#
# Manual now, not on push: the ordinary suite covers this on every push via
# test.yml. Run this by hand if `bad XRef entry` or anything like it reappears —
# section 1 going dirty would be a REAL renderer regression, and that is the
# distinction the whole thing exists to make cheaply.
#
# It reports; it does not gate.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@caistech'

      - name: Install workspace deps
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci --ignore-scripts

      # Only this package, so an unrelated workspace build failure cannot cost
      # the run. The diagnostic imports dist/, which is also how it verifies the
      # ESM entry-point fix on this branch.
      - name: Build report-generator
        run: npx tsc -p packages/report-generator

      - name: Diagnose
        run: node packages/report-generator/test/diagnostics/run.mjs

      # The original failing condition, with the CI skip lifted. Allowed to fail:
      # a red here is the datum, not an accident.
      - name: Unskipped vitest suite (the original failure)
        continue-on-error: true
        working-directory: packages/report-generator
        run: env -u CI npx vitest run --reporter=verbose

      - name: Upload any structurally-bad PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bad-pdfs
          path: ${{ runner.temp }}/*.pdf
          if-no-files-found: ignore
