name: Publish @caistech/* to GitHub Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@caistech'
      # --ignore-scripts: defence in depth. portfolio-gate declared `prepare: npm run
      # build`, which npm fired during install before siblings were built, breaking
      # the install. NOTE the flag alone did NOT suppress it — the prepare script was
      # deleted (prepublishOnly already ran the same build). Kept as a guard against
      # the next one, but do not rely on it to neutralise a prepare script. Found by
      # the test workflow, from a clean checkout.
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      # Shared with test.yml — the curated build ordering lives in one script
      # rather than duplicated across two workflows, where it would drift towards
      # whichever one runs less often.
      - name: Build all workspaces
        run: bash scripts/build-workspaces.sh

      # Run the tests BEFORE publishing. Until now this workflow went
      # install -> build -> publish, so every version of every package in this
      # substrate was published without a single test having run.
      #
      # That was not a small gap. Fifteen packages ship vitest suites — 33 test
      # files covering the Stripe webhook idempotency guard, the Spam Act
      # compliance throw, the first-touch attribution wire format, the voice
      # memory-loop probe and the deal model's golden conformance figures — and
      # they ran only when somebody remembered to run them on their own machine.
      # A guard nobody runs is the failure this repo has already documented
      # twice: probeMemoryLoop shipped in convai 0.7.0 and ran in ZERO repos, and
      # ExecutorAI served a month-old production build because nothing asserted
      # the deployed SHA. Same shape, one level down, in the substrate every
      # product depends on.
      #
      # BLOCKING, deliberately. `--if-present` means packages without a test
      # script are unaffected, so this cannot become a reason to avoid adding
      # tests elsewhere. Verified green across all 15 suites at the time of
      # wiring — which is precisely why it goes in now, while it costs nothing,
      # rather than after something breaks and the step is never added at all.
      - name: Test all workspaces
        run: npm run test --workspaces --if-present
      # Per-workspace publish loop with "skip if already-published" check.
      # Needed for the bootstrap phase where we republish orphaned packages
      # one at a time — each tag after the first would otherwise fail on the
      # already-published packages. Halts on the first TRUE publish failure
      # (e.g. a not-yet-relinked orphan's 403), preserving per-round gating.
      - name: Publish workspaces (skip already-published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for manifest in packages/*/package.json; do
            pkg=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")
            is_private=$(node -p "require('./${manifest}').private || false")
            if [ "$is_private" = "true" ]; then
              echo "SKIP $pkg@$version (private)"
              continue
            fi
            if npm view "$pkg@$version" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
              echo "SKIP $pkg@$version (already published)"
              continue
            fi
            echo "PUBLISH $pkg@$version"
            npm publish --workspace="$pkg" --access restricted
          done
