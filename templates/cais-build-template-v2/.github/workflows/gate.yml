# Portfolio Standard gate — generated from @caistech/portfolio-gate v0.1
#
# Runs typecheck + lint + build, then route + auth smoke tests against the
# preview deploy URL. Fails the action (and blocks Vercel promotion) on any
# non-zero exit.
#
# Closes Portfolio Standard:
#   R1  — Auth four-leg pattern (auth smoke step)
#   R10 — No verbatim Postgres errors (errorResponse helper, enforced at code level)
#   R13 — Route smoke test on every deploy (route smoke step)
#
# Preview URL: this template expects `PORTFOLIO_GATE_PREVIEW_URL` to be set in
# the workflow env. Wire it via the Vercel "Deployment URL" output, the Vercel
# GitHub integration comment scraper, or a custom preview-deploy step. If you
# don't have a preview deploy, set the env to the production URL and accept the
# tradeoff (smoke tests will run against prod every push).

name: portfolio-gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # REQUIRED — set in repo settings or replace with hard-coded production URL.
      # Vercel users: the Vercel GitHub integration writes the preview URL into
      # a comment. Use `amondnet/vercel-action` or pull from `vercel.json`.
      PORTFOLIO_GATE_PREVIEW_URL: ${{ vars.PORTFOLIO_GATE_PREVIEW_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Detect package manager so the cache step + install step use the
      # right tooling. Pnpm workspaces (TourLingo, NDISSDA, F2K trio) need
      # pnpm/action-setup before setup-node can use the `cache: pnpm` key.
      - name: Detect package manager
        id: detect-pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
          fi
          # setup-node's dependency cache REQUIRES a committed lockfile and hard-errors without one
          # ("Dependencies lock file is not found"). Several repos gitignore all three lockfiles, so
          # the gate would fail there before running a single check — not because anything is wrong
          # with the product, but because it cannot warm a cache.
          #
          # Emit an empty cache key in that case: caching is an optimisation, and an optimisation
          # must never be the reason a repo cannot be verified. The missing lockfile is still a real
          # reproducibility problem, but it is the REPO's problem to fix, not something this gate
          # should force by refusing to run.
          if [ -f pnpm-lock.yaml ] || [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ] || [ -f yarn.lock ]; then
            echo "cache=$( [ -f pnpm-lock.yaml ] && echo pnpm || echo npm )" >> $GITHUB_OUTPUT
          else
            echo "::warning title=No committed lockfile::This repo has no committed lockfile, so dependency caching is disabled and builds are not reproducible — CI, Vercel and your machine can each resolve different versions. Commit one."
            echo "cache=" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        if: steps.detect-pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Setup Node with built-in @caistech registry auth (official pattern).
      # Tells setup-node@v4 to write a managed .npmrc that uses
      # `${NODE_AUTH_TOKEN}` — which IS reliably expanded by npm/pnpm (the
      # `${GITHUB_PACKAGES_TOKEN}` substitution in a repo-local .npmrc was
      # not).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: ${{ steps.detect-pm.outputs.cache }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@caistech'

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        env:
          # NODE_AUTH_TOKEN is the convention setup-node@v4 wired up via the
          # `registry-url` + `scope` inputs above. Secret is still
          # CAISTECH_PACKAGES_TOKEN (GitHub Actions reserves the GITHUB_ prefix).
          NODE_AUTH_TOKEN: ${{ secrets.CAISTECH_PACKAGES_TOKEN }}
          # The SAME secret under the other name, because the two environments a repo
          # builds in disagree about what to call it:
          #
          #   GitHub Actions — setup-node exports NODE_AUTH_TOKEN
          #   Vercel         — the portfolio rollout sets GITHUB_PACKAGES_TOKEN
          #
          # A repo-local .npmrc can only name ONE of them, so every repo was broken in
          # whichever environment it did not name — and the failure is a bare 401 that
          # looks like a bad token rather than a missing variable, which is why it cost
          # hours to find. Exporting both makes either spelling correct here, and lets a
          # repo keep the name Vercel needs.
          GITHUB_PACKAGES_TOKEN: ${{ secrets.CAISTECH_PACKAGES_TOKEN }}

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Verify preview URL is set
        run: |
          if [ -z "$PORTFOLIO_GATE_PREVIEW_URL" ]; then
            echo "::error::PORTFOLIO_GATE_PREVIEW_URL is not set. Wire it via repo vars or a preview-deploy step."
            exit 1
          fi
          echo "Preview URL: $PORTFOLIO_GATE_PREVIEW_URL"

      # TEMPORARY (2026-05-19 — portfolio migration in progress):
      # static audits emit warnings but DO NOT block the gate. Revert to
      # blocking by removing the `|| ...` wrapper once the R3 explanatory-header
      # + R14 sample-artefact backfill is done across the portfolio.
      - name: Static audits (R3 / R9 / R11 / R14 / R15 — warning-only)
        run: |
          npx --no-install portfolio-gate-audit-all \
            --base-url "$PORTFOLIO_GATE_PREVIEW_URL" \
            || echo "::warning::Portfolio Standard audits found violations — see step output. Migration in progress; not blocking deploy. Revert this step to blocking once R3 + R14 backfill is complete."

      - name: Route smoke test (Portfolio Standard R13)
        run: |
          npx --no-install portfolio-gate-smoke-routes \
            --config routes.config.json \
            --base-url "$PORTFOLIO_GATE_PREVIEW_URL"

      - name: Auth smoke test (Portfolio Standard R1/R4)
        run: |
          npx --no-install portfolio-gate-smoke-auth \
            --config auth.config.json \
            --base-url "$PORTFOLIO_GATE_PREVIEW_URL"

      # Voice memory-loop gate — SKIPS CLEANLY (exit 0) in any repo that does not declare
      # @caistech/elevenlabs-convai, so it is safe in every repo and costs nothing where there is
      # no voice agent.
      #
      # It is here, in the shared gate, rather than in each repo's own workflow, because the
      # previous arrangement was "each product remembers to verify its own memory loop" — and
      # probeMemoryLoop shipped in 0.7.0 and ran in ZERO repos. The guard existed; nobody ran it;
      # the bug reached production twice. Verification has to be the default, not an act of
      # discipline.
      #
      # Needs, in repos that DO have a voice agent:
      #   MEMORY_LOOP_UID / QA_TEST_USER_ID   a real test user's id
      #   CONVAI_TOOL_SECRET                  if the webhook routes are secret-guarded
      #   NEXT_PUBLIC_SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY   for sentinel cleanup
      # and a memory-loop.config.json naming the webhook path, memory table and tool-secret header.
      - name: Voice memory-loop gate (skips where there is no voice agent)
        env:
          MEMORY_LOOP_UID: ${{ secrets.QA_TEST_USER_ID }}
          CONVAI_TOOL_SECRET: ${{ secrets.CONVAI_TOOL_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Resolve the binary from node_modules DIRECTLY, never via a bare `npx <name>`.
          #
          # `npx --no-install` does not reliably refuse the network. Where the local bin was absent
          # it queried the PUBLIC registry for an unscoped `portfolio-gate-memory-loop`, got a 404,
          # and failed the gate — turning a step that is supposed to skip into a hard failure in
          # every repo whose @caistech/portfolio-gate predates 0.7.0. When this was first swept in
          # that was 26 of 27 repos, all still on ^0.3.0.
          #
          # The skip is a WARNING, not silence. A step that quietly passes when it did not run is
          # the exact failure this gate exists to correct: probeMemoryLoop shipped in 0.7.0 and ran
          # in zero repos precisely because nothing said so out loud.
          BIN=node_modules/.bin/portfolio-gate-memory-loop
          if [ ! -x "$BIN" ]; then
            echo "::warning title=Voice memory loop NOT verified::@caistech/portfolio-gate in this repo predates the memory-loop gate (needs >=0.7.0). The voice memory loop is not being checked here. Bump the dependency to enable it."
            exit 0
          fi
          "$BIN" --config memory-loop.config.json --base-url "$PORTFOLIO_GATE_PREVIEW_URL"

      # Static counterpart to the runtime probe. The Mnemo dual-write happens in the POST-CALL
      # path, which probeMemoryLoop never triggers — so a product missing the semantic leg passes
      # all five runtime checks with no semantic index at all. That is how one product's leg went
      # missing unnoticed. Some checks are only expressible statically; this is one.
      # Skips in non-voice repos. A deliberate omission is declared, not silent:
      #   memory-loop.config.json  ->  { "semanticMemory": false }
      - name: Voice semantic-memory wiring (static; skips where there is no voice agent)
        run: |
          # Same direct resolution + loud skip as the runtime probe above.
          BIN=node_modules/.bin/portfolio-gate-audit-voice-memory
          if [ ! -x "$BIN" ]; then
            echo "::warning title=Voice semantic-memory wiring NOT audited::@caistech/portfolio-gate in this repo predates the static voice-memory audit (needs >=0.7.0). Bump the dependency to enable it."
            exit 0
          fi
          "$BIN"

      # Is production actually running the code we think it is? Only meaningful against the real
      # production deployment, so it runs on push-to-main (and any scheduled run), not on PRs.
      #
      # Born from a month-long silent outage: every production deploy failed at `npm install`
      # (expired NODE_AUTH_TOKEN -> 401 from GitHub Packages) while production kept serving a
      # month-old build. Nothing noticed. Among the undeployed commits were RLS hardening and
      # admin MFA enforcement.
      #
      # Three assertions, because the obvious ones are not enough: READY, the deployed SHA matches
      # this ref (catches a STALE prod that looks healthy), and the public URL serves the APP --
      # Vercel's SSO protection page answers HTTP 200 with a login screen, so a "curl returns 200"
      # check passes against a wall.
      #
      # Repo setup: VERCEL_TOKEN secret; PUBLIC_ALIAS must be a PUBLICLY reachable production URL
      # (not a protected alias); APP_MARKER a string present in the app but never on a wall.
      # A repo that genuinely does not deploy on Vercel opts out with a RECORDED reason:
      #   portfolio-gate-deploy-status --not-applicable "static export, no Vercel project"
      - name: Deploy status (production matches this ref)
        if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PUBLIC_ALIAS: ${{ vars.PUBLIC_ALIAS }}
          APP_MARKER: ${{ vars.APP_MARKER }}
        run: |
          # Same direct resolution + loud skip as the probes above.
          BIN=node_modules/.bin/portfolio-gate-deploy-status
          if [ ! -x "$BIN" ]; then
            echo "::warning title=Deploy status NOT verified::@caistech/portfolio-gate in this repo predates the deploy-status gate (needs >=0.8.0). Production could be serving stale code and nothing here would notice. Bump the dependency to enable it."
            exit 0
          fi
          # --wait on push: poll until the deployment for this commit settles.
          "$BIN" ${{ github.event_name == 'push' && '--wait' || '' }}
