# Corporate AI Solutions — portfolio env-var manifest
#
# Single source of truth for which env vars MUST exist on each portfolio
# project's Vercel deploy target. Consumed by:
#   - @caistech/portfolio-env-sync (audit + apply)
#   - scripts/onboard-new-project.sh (new-project onboarding)
#   - scripts/set-caistech-token.sh (eventually — see Issue #4)
#
# v0 of portfolio-env-sync is audit-only and checks key NAMES per target,
# not values. `value: "TBD"` and `ref: "$secret:..."` are accepted but
# treated as opaque — they only become meaningful in v0.5+ (`--apply`).
#
# To run the audit:
#   export VERCEL_TOKEN=$(cat ~/.vercel-token)
#   node packages/portfolio-env-sync/dist/index.js --manifest portfolio-manifest.yaml

team_id: "team_hwN7IFtd2Fo3DCj9C67ZwI1t" # Corporate AI Solutions

# -----------------------------------------------------------------------------
# Secret resolution — maps $secret:NAME refs in shared/projects to their
# real source. Supports `from_supabase` + `from_env`. Future: from_op
# (1Password). Apply mode looks up these entries when it encounters a ref.
# -----------------------------------------------------------------------------
secrets:
  platform_trust_service_key:
    from_supabase:
      project_ref: "ggwveltavnvvscgqekhy"
      field: "service_role_key"

  # Stripe — CAIS platform account. from_env: the operator exports STRIPE_SECRET_KEY /
  # STRIPE_WEBHOOK_SECRET in their shell, then `--apply` pushes them to each declared project's
  # Vercel as a SENSITIVE var. The value is never committed.
  stripe_secret_key:
    from_env:
      var: STRIPE_SECRET_KEY
  stripe_webhook_secret:
    from_env:
      var: STRIPE_WEBHOOK_SECRET

  # ABR (Australian Business Register) web-services GUID — powers the CANONICAL ABN lookup route
  # (@caistech/corporate-components/abn-lookup). Declared here because it was NOT canonical and got
  # copied repo-to-repo instead: it existed in BucketLyst and DealFindrs, was absent from Kira, and
  # the absence is INVISIBLE — the route returns {configured:false} and every ABN field silently
  # degrades to a plain text input, exactly as designed to fail safe. A credential that is only ever
  # copied is a credential the next repo simply doesn't have.
  abr_guid:
    from_env:
      var: ABR_GUID

  # Resend — CAIS platform email (auth SMTP + transactional sends like vault invites).
  # Operator exports RESEND_API_KEY in their shell; `--apply` pushes it to each declared
  # project's Vercel as SENSITIVE. The value is never committed.
  resend_api_key:
    from_env:
      var: RESEND_API_KEY

  # ElevenLabs — voice-agent PROVISIONING key (operator-exported), read by new-product.mjs +
  # scripts/align-morgan-agent.mjs to create/align Convai agents. Declared here so the source is
  # canonical.
  #
  # SCOPED EXCEPTION (2026-07-27) — this key WAS "never push it to a product Vercel", on the
  # reasoning that the runtime only needs the public NEXT_PUBLIC_ELEVENLABS_AGENT_ID. That held
  # while every product used ONE shared, build-time-provisioned agent. It no longer holds for a
  # product on the one-agent-per-user model (@caistech/elevenlabs-convai ≥0.7.1 `ensureUserAgent`),
  # where each user's agent is provisioned SERVER-SIDE ON FIRST PAGE LOAD — so the key is a genuine
  # runtime secret there, not a build-time one. BucketLyst is the first; any memory-bearing product
  # will be the same. Push it only to those, always `sensitive`, production+preview.
  #
  # Products on a single shared agent still must NOT receive it.
  elevenlabs_api_key:
    from_env:
      var: ELEVENLABS_API_KEY

# -----------------------------------------------------------------------------
# Shared bindings — included via `inherit_shared:` in each project below.
# -----------------------------------------------------------------------------
shared:
  # Platform-trust shared infra (one Supabase project for trust events
  # across the whole portfolio).
  PLATFORM_TRUST_SUPABASE_URL: "https://ggwveltavnvvscgqekhy.supabase.co"
  PLATFORM_TRUST_SERVICE_KEY: { ref: "$secret:platform_trust_service_key" }

  # GH Packages PAT — needed for `npm install` of @caistech/* during build.
  # Propagated by scripts/set-caistech-token.sh.
  GITHUB_PACKAGES_TOKEN: { ref: "$secret:github_packages_token" }

  # Common LLM provider keys — present in most consumer apps.
  ANTHROPIC_API_KEY: { ref: "$secret:anthropic_api_key" }
  OPENAI_API_KEY: { ref: "$secret:openai_api_key" }

  # Resend API key — auth SMTP + transactional email (e.g. vault party invites).
  # Operator-sourced (from_env: RESEND_API_KEY); set on Vercel as SENSITIVE, production+preview only.
  RESEND_API_KEY: { ref: "$secret:resend_api_key", targets: ["production", "preview"] }

  # ABR GUID — inherit in ANY product with a company/ABN field (PRODUCT_STANDARDS forbids a plain
  # text input for those). Sensitive + production/preview only: it is a server-side credential, and
  # the lookup route must never expose it to the client.
  ABR_GUID: { ref: "$secret:abr_guid", targets: ["production", "preview"] }

  # Stripe — CAIS PLATFORM account ONLY (CAIS-owned products: SayFix billing, cockpit, etc.).
  # CLIENT products (mmcbuild, etc.) use their OWN Stripe account — do NOT inherit these there.
  # The VALUE never lives here: it's a $secret ref resolved at apply-time (operator-sourced from the
  # password manager / future from_env), and set on Vercel as SENSITIVE, production+preview only —
  # never committed, never `development` (PRODUCT_STANDARDS Vercel sensitive-env-var rule).
  STRIPE_SECRET_KEY: { ref: "$secret:stripe_secret_key", targets: ["production", "preview"] }
  STRIPE_WEBHOOK_SECRET: { ref: "$secret:stripe_webhook_secret", targets: ["production", "preview"] }

  # ─────────────────────────────────────────────────────────────────────────
  # CANONICAL SENDER IDENTITY (Australian Spam Act 2003, pillar 2)
  #
  # The legal entity behind every email the PORTFOLIO sends. Consumed by
  # @caistech/email-compliance (senderFromEnv → the identification footer) and
  # pushed to every project by @caistech/portfolio-env-sync.
  #
  # NOT secrets — these are printed at the bottom of emails on purpose, so they
  # are literal values here rather than $secret refs. Still production+preview
  # only, per the Vercel env rule.
  #
  # ⚠️ WHITE-LABEL GATE: a distributor / white-label product must send under the
  # DISTRIBUTOR's name and ABN, NOT these. Override per-send with
  # `compliance.sender` (see @caistech/email-send) rather than inheriting these.
  # This is the "whose brand travels" rule — getting it wrong puts our ABN on
  # someone else's marketing.
  #
  # Locked 2026-07-26 by the operator. ACN 672 395 685; the ABN embeds it.
  # ─────────────────────────────────────────────────────────────────────────
  EMAIL_SENDER_NAME: { value: "Global Buildtech Australia Pty Ltd", targets: ["production", "preview"] }
  EMAIL_SENDER_EMAIL: { value: "dennis@corporateaisolutions.com", targets: ["production", "preview"] }
  EMAIL_SENDER_ABN: { value: "54 672 395 685", targets: ["production", "preview"] }
  EMAIL_SENDER_POSTAL: { value: "76-84 Brunswick Street, Fortitude Valley QLD 4006", targets: ["production", "preview"] }
  EMAIL_SENDER_PHONE: { value: "+61402612471", targets: ["production", "preview"] }

  # Standard accounts — created in every product's Supabase project by
  # scripts/provision-qa-accounts.mjs. See PRODUCT_STANDARDS.md §9.5.
  # Standard set (2026-06-08): the two human operators + a dedicated admin-AGENT
  # (qa-admin@) for the autonomous admin-portal checks, and a non-admin user-agent
  # (qa-user@) for the user/landing checks. admin_users → each product's ADMIN_EMAILS;
  # test_user is deliberately NOT in admin_users (must fail the user-blocked-from-/admin
  # check VT_B2). qa-admin@ is a dedicated agent identity, separate from the operators,
  # so no agent run ever drives a real operator account.
  admin_users:
    - email: dennis@corporateaisolutions.com # operator (by hand)
    - email: mcmdennis@gmail.com # operator (by hand)
    - email: dennis+qaadmin@factory2key.com.au # admin-AGENT (QA_TEST_ADMIN_EMAIL) — §9.5 canonical (was the stale qa-admin@qa.corporateaisolutions.com, which is why the agent was never in any product's ADMIN_EMAILS → VT_A1 Access Denied)
  test_user:
    email: dennis@factory2key.com.au # user-agent (QA_TEST_USER_EMAIL) — §9.5 canonical (was the stale qa-user@qa.corporateaisolutions.com)

  # Property-services shared infra (one Supabase project + edge functions
  # for property intelligence across F2K, mmcbuild, deal-findrs).
  # As of 2026-04-30 the /derive and /assess functions are deployed
  # `--no-verify-jwt` and require an X-API-Key (issued per-consumer from
  # the property-services Supabase api_keys table). The anon key is kept
  # in shared for transition; new consumers should rely on apiKey only.
  NEXT_PUBLIC_PROPERTY_SERVICES_URL: "https://qppddipgixhinprliyxh.supabase.co"
  NEXT_PUBLIC_PROPERTY_SERVICES_ANON_KEY: { ref: "$secret:property_services_anon_key" }

